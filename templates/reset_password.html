{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-lg border-0">
      <div class="card-header bg-warning text-dark text-center py-4">
        <h4 class="mb-0 fw-bold">إعادة تعيين كلمة المرور</h4>
        <div class="small">{{ t('Réinitialisation du mot de passe', 'إعادة تعيين كلمة المرور') }}</div>
      </div>
      <div class="card-body p-4">
        {% if error %}
          <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST">
          {{ csrf_field() }}
          <div class="mb-3">
            <label class="form-label">{{ t('Nouveau mot de passe', 'كلمة المرور الجديدة') }}</label>
            <input type="password" name="password" class="form-control" autocomplete="new-password" minlength="6" required>
          </div>
          <div class="mb-4">
            <label class="form-label">{{ t('Confirmer', 'تأكيد') }}</label>
            <input type="password" name="password_confirm" class="form-control" autocomplete="new-password" minlength="6" required>
          </div>
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-warning btn-lg">{{ t('Enregistrer', 'حفظ') }}</button>
          </div>
        </form>
      </div>
      <div class="card-footer text-center bg-light">
        <a href="/login" class="fw-bold">{{ t('Retour login', 'العودة إلى تسجيل الدخول') }}</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
