{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-lg border-0">
            <div class="card-header bg-success text-white text-center py-4">
                <h4 class="mb-0 fw-bold">إنشاء حساب جديد</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                {{ csrf_field() }}
                    <div class="mb-3">
                        <label class="form-label">{{ t("Nom d'utilisateur (Login)", 'اسم المستخدم للدخول') }}</label>
                        <input type="text" name="username" class="form-control" autocomplete="username" placeholder="ex: prof.maths" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ t('Nom affiché (ex: الأستاذ محمد)', 'الاسم المعروض (مثال: الأستاذ محمد)') }}</label>
                        <input type="text" name="nom_affichage" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ t("Nom de l'etablissement", 'اسم المؤسسة') }}</label>
                        <input type="text" name="school_name" class="form-control" placeholder="ex: College El Amal" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ t('Matiere (ex: Sciences physiques)', 'المادة (مثال: العلوم الفيزيائية)') }}</label>
                        <input type="text" name="subject_name" class="form-control" placeholder="ex: Sciences physiques" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">{{ t('Mot de passe', 'كلمة المرور') }}</label>
                        <input type="password" name="password" class="form-control" autocomplete="new-password" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success btn-lg">{{ t("S'inscrire", 'إنشاء حساب') }}</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center bg-light">
                <p class="mb-0">لديك حساب؟ <a href="/login" class="text-success fw-bold">{{ t('Se connecter', 'تسجيل الدخول') }}</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
